[project]
name = "windowssearchutility"
version = "0.1.0"
description = "A small tool that non-invasively replaces Windows Search with other tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dependency-injector>=4.47.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psutil>=7.0.0",
    "pydantic>=2.11.5",
    "pynput>=1.8.1",
    "pyside6>=6.9.0",
    "pyside6-fluent-widgets[full]>=1.8.3",
    "pywin32>=310",
    "pywinauto>=0.6.9",
    "tomlkit>=0.13.2",
    "windows-toasts>=1.3.1",
]

[tool.semantic_release]
version_variables = [
    "src/core/constants.py:VERSION",
    "src/setup.iss:AppVersion",
    ".github/workflows/ci.yaml:NEW_VERSION",
    "scripts/build.ps1:NEW_VERSION"
]
version_toml = [
    "pyproject.toml:project.version"
]
commit_message = "chore: release v{version}\n\nAutomatically generated by python-semantic-release"
major_on_zero = false

[tool.semantic_release.changelog]
mode = "update"
template_dir="config/release-templates/"

[tool.semantic_release.publish]
dist_glob_patterns=["src/Output/*"]
